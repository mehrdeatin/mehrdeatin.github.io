title: "メイドアイティシュの群像"
title_en: "mehrdeatin no gunzou"
description: "ダークファンタジー × 群像劇 × 架空神話 ― 世界観アーカイブ"

# ---- SEO関連 ----
# jekyll-seo-tag / jekyll-sitemap の元になる設定。
# url と baseurl は、実際にGitHub Pagesを公開してURLが確定してから必ず埋めてください
# (ここが空のままだと、sitemap.xmlやOGPのURLが正しく生成されません)。
url: ""       # 例: "https://ユーザー名.github.io"
baseurl: ""   # 例: "" (ユーザー名.github.io リポジトリ) / "/リポジトリ名" (プロジェクトページ)
lang: ja
locale: ja_JP
logo: /assets/images/works/nemophila-reversi/key.jpg  # OGP等のデフォルト画像。用意でき次第パスを差し替えてください
author: ""            # 任意。個人名やハンドルネームを出したくなければ空のままでOK
twitter:
  username: ""        # 任意。Twitter Card用。使わないなら空のままでOK
  card: summary_large_image
social:
  name: "メイドアイティシュの群像"
  links: []

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
permalink: pretty

collections:
  works:
    output: true
    permalink: /works/:path/
  characters:
    output: true
    permalink: /characters/:slug/
  terms:
    output: true
    permalink: /terms/:slug/
  chapters:
    output: true
    permalink: /works/:path/   # 実際は各ファイルのfront matterで permalink を明示するので、これはフォールバック
  chapters:
    output: true   # 各話の本文ページ。URLは各ファイルの permalink で指定する

defaults:
  - scope:
      path: ""
      type: "works"
    values:
      layout: "work-portal"
  - scope:
      path: ""
      type: "characters"
    values:
      layout: "character"
  - scope:
      path: ""
      type: "terms"
    values:
      layout: "term"
  - scope:
      path: ""
      type: "chapters"
    values:
      layout: "chapter"
  - scope:
      path: ""
      type: "chapters"
    values:
      layout: "chapter"
  - scope:
      path: ""
    values:
      layout: "default"

# 画像最適化(GitHub Actions)は assets/images/**/original/ に置いた元画像を
# ビルド前に自動でリサイズ・WebP化して assets/images/**/optimized/ に出力する想定
exclude:
  - node_modules
  - scripts
  - package.json
  - package-lock.json
  - README.md
  - Gemfile
  - Gemfile.lock
  - assets/images/works/originals
  - assets/images/characters/originals
